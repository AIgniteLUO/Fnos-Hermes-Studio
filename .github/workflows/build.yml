name: Build fnOS Hermes Studio FPK

# 每次 push 到 main 自动构建 FPK，并发布为滚动预发布版本（latest）。
# 也可手动触发（workflow_dispatch），手动时可覆盖版本号。
#
# 说明：FPK 在 CI 构建时把 hermes-web-ui 的 node_modules（含编译好的原生 node-pty）
# 作为 app/node 打进包（scripts/build-fpk.sh 的 ensure_node_bundle）。安装时
# install_callback 走 Path A 离线复制，几秒完成，不再依赖 fnOS 联网编译（fnOS 缺 gcc）。
# app/node 不入库（.gitignore 排除），每次 CI 由 Node v24 + gcc/g++ 重新编译生成。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（格式：0.6.33-1，留空则使用 manifest 中的版本）'
        required: false
        default: ''
  # 自动更新（auto-update.yml）完成并 push 版本 bump 后，由本触发器接力构建。
  # 关键：auto-update 用默认 GITHUB_TOKEN 推送不会触发上面的 push 事件（GitHub 限制），
  # 必须用 workflow_run 才能在本仓库内接力触发构建与发布。
  workflow_run:
    workflows: ["Auto-update upstream versions"]
    types: [completed]

permissions:
  contents: write

env:
  APP_NAME: "hermes-studio"
  MANIFEST_FILE: "manifest"

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set timezone
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep "^version" ${{ env.MANIFEST_FILE }} | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "从 manifest 读取的版本号：v$VERSION"

      - name: Determine target version
        id: target_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
            echo "使用输入的版本号：v$TARGET_VERSION"
          else
            TARGET_VERSION="${{ steps.version.outputs.version }}"
            echo "使用 manifest 版本号：v$TARGET_VERSION"
          fi
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT

      # fnpack 为飞牛官方打包工具（从 static2.fnnas.com 下载）。CI 网络可能无法访问该
      # CDN，因此设为「可选」：下载/校验失败时不阻断，build-fpk.sh 会自动回退到
      # 纯 tar+gzip 构建（双层 tar.gz 格式，经真实 .fpk 样本验证与官方结构一致）。
      - name: Install fnpack (optional; falls back to tar+gzip)
        continue-on-error: true
        run: |
          set +e
          URL="https://static2.fnnas.com/fnpack/fnpack-1.0.4-linux-amd64"
          for i in 1 2 3; do
            echo "尝试下载 fnpack ($i/3)..."
            if curl -fsSL "$URL" -o fnpack \
               && chmod +x fnpack \
               && mv fnpack /usr/local/bin/ \
               && command -v fnpack >/dev/null \
               && fnpack --version; then
              echo "fnpack 就绪"
              exit 0
            fi
            rm -f fnpack
            sleep 3
          done
          echo "::warning:: fnpack 不可用，将使用纯 tar+gzip 兜底构建"

      - name: Create dist directory
        run: mkdir -p dist

      # bundled node（含原生 node-pty）必须在与 fnOS 运行时相同 ABI 的环境下编译，
      # 否则 fnOS 上的 nodejs_v24 加载不了。这里固定 Node v24，且 ubuntu-latest 自带
      # gcc/g++/make/python3 可编译 node-pty。
      - name: Setup Node.js v24 (for bundled node ABI match)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      # Hermes Agent 官方 install.sh 默认 git clone NousResearch/hermes-agent。
      # 大量 NAS 无法稳定连接 GitHub，导致安装后 Agent 启动不了。
      # CI 在 GitHub 内网下载源码并嵌入 FPK，install_callback 会优先用本地包
      # 并跳过网络 clone。
      # Hermes Agent 离线源码为 v0.6.33-19 的核心修复点：若下载/解压失败则直接
      # 中止构建，绝不能发布一个不含离线源码的 v19（那等于没修）。
      #
      # 注意：早期此处硬编码 tarball/main，导致 build-fpk.sh 里「钉 release 标签」
      # 的逻辑被覆盖、实际一直拉 main。现统一按 config/bootstrap/hermes-agent-version.env
      # 的 HERMES_AGENT_VERSION 钉标签下载（由 auto-update.yml 自动与上游最新 release 对齐）；
      # 用 .bundled-agent-ref 记录当前 ref，env 变更时自动重新下载；标签下载失败回退 main。
      - name: Prepare Hermes Agent offline source
        run: |
          set -e
          DESIRED_REF="$(grep '^HERMES_AGENT_VERSION=' config/bootstrap/hermes-agent-version.env | cut -d= -f2)"
          [ -z "$DESIRED_REF" ] && DESIRED_REF="main"
          REF_MARKER="app/hermes-agent-src/.bundled-agent-ref"
          if [ -f "$REF_MARKER" ] && [ "$(cat "$REF_MARKER")" = "$DESIRED_REF" ] && [ -f "app/hermes-agent-src/pyproject.toml" ]; then
            echo "Hermes Agent 离线源码包已存在且 ref 匹配 ($DESIRED_REF)，跳过下载"
            exit 0
          fi
          echo "下载 Hermes Agent 源码包 (ref=$DESIRED_REF)..."
          rm -rf app/hermes-agent-src /tmp/ha.tar.gz /tmp/ha-extract
          mkdir -p /tmp/ha-extract
          for i in 1 2 3; do
            echo "  尝试下载 ($i/3)..."
            if curl -fsSL --max-time 600 "https://api.github.com/repos/NousResearch/hermes-agent/tarball/${DESIRED_REF}" -o /tmp/ha.tar.gz; then
              break
            fi
            echo "  下载失败，重试..."
            sleep 5
          done
          # 标签下载失败回退 main（保证离线包仍能生成，仅失去该次可复现性）
          if [ ! -s /tmp/ha.tar.gz ] && [ "$DESIRED_REF" != "main" ]; then
            echo "WARNING: 按 $DESIRED_REF 下载失败，回退 main"
            for i in 1 2 3; do
              curl -fsSL --max-time 600 "https://api.github.com/repos/NousResearch/hermes-agent/tarball/main" -o /tmp/ha.tar.gz && break
              sleep 5
            done
            DESIRED_REF="main"
          fi
          [ -s /tmp/ha.tar.gz ] || { echo "::error:: Hermes Agent 源码包下载失败（GitHub 网络问题），中止构建"; exit 1; }
          mkdir -p app/hermes-agent-src
          tar -xzf /tmp/ha.tar.gz -C /tmp/ha-extract --strip-components=1
          mv /tmp/ha-extract/* app/hermes-agent-src/
          [ -f "app/hermes-agent-src/pyproject.toml" ] || { echo "::error:: 解压后未找到 pyproject.toml，源码包异常"; exit 1; }
          (
            cd app/hermes-agent-src
            git init -q
            git config user.email "ci@local"
            git config user.name "CI Builder"
            git add -A
            git commit -q -m "offline bundle"
          )
          echo "$DESIRED_REF" > "$REF_MARKER"
          touch app/hermes-agent-src/.offline-bundle
          echo "离线源码包准备完成 (ref=$DESIRED_REF)"
          du -sh app/hermes-agent-src

      # 复用本地已验证的构建脚本（优先 fnpack，未找到则纯 tar+gzip，并自动补 manifest.checksum）。
      - name: Build FPK
        id: build
        run: |
          if ! bash scripts/build-fpk.sh dist; then
            echo "::error:: FPK 打包失败"
            exit 1
          fi
          TARGET_NAME="fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk"
          if [ ! -f "dist/$TARGET_NAME" ]; then
            echo "::error:: 未生成 $TARGET_NAME"
            exit 1
          fi
          SIZE=$(du -h "dist/$TARGET_NAME" | cut -f1)
          echo "打包成功：$TARGET_NAME ($SIZE)"
          echo "fpks=$TARGET_NAME" >> $GITHUB_OUTPUT

      # 校验 FPK 基本结构（外层含 manifest / cmd/ / wizard/ / app.tgz 必须存在）。
      # app/node（bundled 运行时，含编译好的 node-pty）为强制项：缺它安装会回退
      # npm install，而 fnOS 无 gcc 编不出 node-pty → 安装卡死。绝不允许再发这种包。
      - name: Verify FPK structure
        run: |
          FPK="dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk"
          echo "校验 $FPK 基本结构 ..."
          for need in '^manifest$' '^cmd/' '^wizard/' '^app.tgz$'; do
            if ! tar tzf "$FPK" | grep -qE "$need"; then
              echo "::error:: FPK 缺少必要内容: $need"
              exit 1
            fi
          done
          echo "✅ 基本结构完整 (manifest / cmd / wizard / app.tgz)"
          # 进一步确认 app.tgz 内含 app 运行时入口，并判断是否有 bundled app/node
          # 注意：app.tgz 体积大（含 node_modules / hermes-agent-src），之前用
          # `tar xzf "$FPK" -O app.tgz | tar tzf -` 或 `tar xzf ... app.tgz -O > 文件`
          # 都会因为管道/指定成员提取问题导致 INNER 为空、误判未包含 bundled node。
          # 最稳方案：把整个外层 FPK 解压到临时目录，再对磁盘上的 app.tgz 做 tar tzf。
          TMPDIR=$(mktemp -d)
          echo "临时解压目录: $TMPDIR"
          tar xzf "$FPK" -C "$TMPDIR"
          echo "外层解压后文件列表:"
          ls -la "$TMPDIR"
          echo "app.tgz 大小:"
          ls -lh "$TMPDIR/app.tgz" || echo "::error:: 未找到 $TMPDIR/app.tgz"
          INNER=$(tar tzf "$TMPDIR/app.tgz" 2>/dev/null)
          echo "INNER 行数: $(echo "$INNER" | wc -l)"
          # fnpack 打出的 app.tgz 内部条目不带 app/ 前缀（fnOS 解包时再放回 app/），
          # 而兜底纯 tar 构建（tar -cf - app）内部带 app/ 前缀。两种都合法，
          # 因此所有校验正则都允许可选的 app/ 前缀，避免误判。
          echo "$INNER" | grep -qE '^(app/)?(bin|skills|ui)/' \
            && echo "ℹ️ app.tgz 内含 bin|skills|ui" \
            || echo "⚠️ app.tgz 结构异常"
          if echo "$INNER" | grep -qE '^(app/)?node/lib/node_modules/hermes-web-ui/bin/hermes-web-ui\.mjs$'; then
            echo "✅ 检测到 bundled 运行时 app/node（离线安装，无需联网编译）"
          else
            echo "::error:: FPK 未包含 bundled app/node，安装将回退 npm install 并因 fnOS 缺 gcc 失败，构建中止"
            exit 1
          fi
          if echo "$INNER" | grep -qE '(app/)?node-pty/build/Release/[^/]*\.node$'; then
            echo "✅ node-pty 原生模块已打包（离线安装无需联网编译）"
          else
            echo "::warning:: 未检测到 node-pty 编译产物，离线安装可能仍需联网编译"
          fi
          if echo "$INNER" | grep -qE '^(app/)?hermes-agent-src/pyproject\.toml$'; then
            echo "✅ 检测到 Hermes Agent 离线源码包，安装时将跳过 git clone"
          else
            echo "⚠️ 未包含 Hermes Agent 离线源码包，安装时仍会尝试 git clone"
          fi
          # Agent browser tools + TUI 依赖（hermes-agent-node）：v0.6.33-24 曾因打包脚本
          # 路径 bug 把构建机绝对路径（/home/runner/work/.../.agent-node-work）带进包，
          # 导致 hermes-agent-node/node_modules 根目录不存在，install_callback 静默回退
          # 到 npm install。这里改为硬性校验：① 禁止污染路径；② 必须含 node_modules 根目录
          # （已含 hoist 的 TUI 依赖）；ui-tui 单独依赖缺失仅警告，不阻断发布。
          if echo "$INNER" | grep -qE 'hermes-agent-node/(home/|.*/\.agent-node-work/)'; then
            echo "::error:: hermes-agent-node 内混入构建机绝对路径，打包脚本路径处理 bug 复发，构建中止"
            exit 1
          fi
          if echo "$INNER" | grep -qE '^(app/)?hermes-agent-node/node_modules/'; then
            echo "✅ 检测到 Agent browser tools 依赖（hermes-agent-node/node_modules），首启将跳过 npm install"
          else
            echo "::error:: FPK 未包含 hermes-agent-node/node_modules，首启仍会联网跑 npm install，构建中止"
            exit 1
          fi
          if echo "$INNER" | grep -qE '^(app/)?hermes-agent-node/ui-tui/node_modules/'; then
            echo "✅ 检测到 Agent TUI 依赖（hermes-agent-node/ui-tui/node_modules）"
          else
            echo "⚠️ 未包含 hermes-agent-node/ui-tui/node_modules，TUI 可能仍需联网安装（其余依赖已离线）"
          fi

      # 额外生成一个固定文件名，便于「总是下载最新版」。
      - name: Copy to rolling asset name
        run: |
          cp "dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk" \
             "dist/fnos-${{ env.APP_NAME }}.fpk"
          echo "已生成 dist/fnos-${{ env.APP_NAME }}.fpk"

      # 发布到滚动预发布版本 latest：每次 push 覆盖更新，固定文件名方便获取最新。
      - name: Publish rolling release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest FPK (auto-build)"
          prerelease: true
          overwrite: true
          files: |
            dist/fnos-${{ env.APP_NAME }}.fpk
            dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk
          body: |
            Hermes Studio for fnOS (npm 原生部署，非 Docker) — 自动构建

            - 包版本（迭代号）：`${{ steps.target_version.outputs.target_version }}`
            - 提交：`${{ github.sha }}`
            - 生成时间：${{ github.event.head_commit.timestamp }}

            > ⚠️ 这是滚动预发布版本，每次 push 到 main 会覆盖 `fnos-hermes-studio.fpk`。
            > 固定版本请下载带版本号的附件 `fnos-hermes-studio_v${{ steps.target_version.outputs.target_version }}.fpk`。

      # 每次 push 若 manifest 版本号较上次有新值，则额外发布一个「稳定版」Release，
      # 把带版本号的 fpk 作为附件（用户原需求：fpk 作为 Release 附件）。
      # 已存在同名稳定版则跳过，保证幂等、不重复建版。
      - name: Publish stable release (if new version)
        if: success()
        run: |
          set -e
          ASSET="dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk"
          [ -f "$ASSET" ] || { echo "::error:: 找不到 $ASSET"; exit 1; }
          HERMES_WEBUI_VER="$(grep '^HERMES_STUDIO_VERSION=' config/bootstrap/hermes-studio-version.env | cut -d= -f2)"
          HERMES_AGENT_VER="$(grep '^HERMES_AGENT_VERSION=' config/bootstrap/hermes-agent-version.env | cut -d= -f2)"
          cat > /tmp/relnotes.md <<'NOTE'
          Hermes Studio for fnOS — 稳定版 v${{ steps.target_version.outputs.target_version }}

          **打包追踪的上游版本**（由 auto-update.yml 自动对齐）：hermes-web-ui `__WEBUI__` ｜ hermes-agent `__AGENT__`

          ## 本次更新（v${{ steps.target_version.outputs.target_version }}）
          - 跟随官方 GitHub Release 预构建产物（EKKOLearnAI/hermes-studio）自动对齐 hermes-web-ui 版本，比 npm 发布更及时。
          - 内置 Hermes Agent 离线源码包（按 NousResearch/hermes-agent 最新 release 标签钉版本），安装时跳过 GitHub git clone，适合 NAS 弱网环境。
          - Agent browser tools + TUI 依赖预装进 FPK，首启跳过后台 npm install，启动更快。
          - bundled node 运行时不入库，CI 用 Node v24 编译含原生 node-pty，安装走离线复制，避免 fnOS 缺 gcc 导致安装卡死。
          - 安装前自动环境检查：Node.js、8648 端口占用、清理残留进程 / IPC socket / PID 文件、修复数据目录属主。

          > ⚠️ 若从旧版本升级仍异常，建议先 pkill -9 -f hermes 并卸载旧版后再重装。

          ## 安装说明
          1. 飞牛应用中心 -> 手动安装 -> 选择本 fpk。
          2. 安装后首次启动会自动在后台安装 Hermes Agent（约 1-3 分钟），请稍候。
          3. 默认监听 8648 端口，点击应用图标在浏览器打开。

          固定版本请从本 Release 附件下载 fnos-hermes-studio_v${{ steps.target_version.outputs.target_version }}.fpk；
          最新滚动版见 Release latest。
          NOTE
          sed -i "s/__WEBUI__/${HERMES_WEBUI_VER}/; s/__AGENT__/${HERMES_AGENT_VER}/" /tmp/relnotes.md
          echo "稳定版发布说明已生成：/tmp/relnotes.md"

      - name: Publish stable release (upload)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.target_version.outputs.target_version }}
          name: "Hermes Studio v${{ steps.target_version.outputs.target_version }}"
          prerelease: false
          overwrite: true
          files: dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk
          body_path: /tmp/relnotes.md

      - name: Build Summary
        run: |
          echo "### ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 版本 | FPK 文件名 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| fnOS Hermes Studio | v${{ steps.target_version.outputs.target_version }} | fnos-hermes-studio_v${{ steps.target_version.outputs.target_version }}.fpk |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "滚动最新版见 Release **latest** 的附件 \`fnos-hermes-studio.fpk\`。" >> $GITHUB_STEP_SUMMARY
