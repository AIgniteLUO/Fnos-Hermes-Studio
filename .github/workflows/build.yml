name: Build fnOS Hermes Studio FPK

# 每次 push 到 main 自动构建 FPK，并发布为滚动预发布版本（latest）。
# 也可手动触发（workflow_dispatch），手动时可覆盖版本号。
#
# 说明：仓库不纳入 bundled 运行时 app/node（体积大 / GitHub 拒 >100MB）。
# 打出的 FPK 在安装时由 install_callback 走 npm install 兜底安装 hermes-web-ui
# （与已在 249 上验证可用的历史包行为一致）；如需离线安装，可在本地先
# `npm install -g hermes-web-ui@0.6.33 --prefix app/node` 再构建。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（格式：0.6.33-1，留空则使用 manifest 中的版本）'
        required: false
        default: ''

permissions:
  contents: write

env:
  APP_NAME: "hermes-studio"
  MANIFEST_FILE: "manifest"

jobs:
  build-fpk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set timezone
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep "^version" ${{ env.MANIFEST_FILE }} | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "从 manifest 读取的版本号：v$VERSION"

      - name: Determine target version
        id: target_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
            echo "使用输入的版本号：v$TARGET_VERSION"
          else
            TARGET_VERSION="${{ steps.version.outputs.version }}"
            echo "使用 manifest 版本号：v$TARGET_VERSION"
          fi
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT

      # fnpack 为飞牛官方打包工具（从 static2.fnnas.com 下载）。CI 网络可能无法访问该
      # CDN，因此设为「可选」：下载/校验失败时不阻断，build-fpk.sh 会自动回退到
      # 纯 tar+gzip 构建（双层 tar.gz 格式，经真实 .fpk 样本验证与官方结构一致）。
      - name: Install fnpack (optional; falls back to tar+gzip)
        continue-on-error: true
        run: |
          set +e
          URL="https://static2.fnnas.com/fnpack/fnpack-1.0.4-linux-amd64"
          for i in 1 2 3; do
            echo "尝试下载 fnpack ($i/3)..."
            if curl -fsSL "$URL" -o fnpack \
               && chmod +x fnpack \
               && mv fnpack /usr/local/bin/ \
               && command -v fnpack >/dev/null \
               && fnpack --version; then
              echo "fnpack 就绪"
              exit 0
            fi
            rm -f fnpack
            sleep 3
          done
          echo "::warning:: fnpack 不可用，将使用纯 tar+gzip 兜底构建"

      - name: Create dist directory
        run: mkdir -p dist

      # 复用本地已验证的构建脚本（优先 fnpack，未找到则纯 tar+gzip，并自动补 manifest.checksum）。
      - name: Build FPK
        id: build
        run: |
          if ! bash scripts/build-fpk.sh dist; then
            echo "::error:: FPK 打包失败"
            exit 1
          fi
          TARGET_NAME="fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk"
          if [ ! -f "dist/$TARGET_NAME" ]; then
            echo "::error:: 未生成 $TARGET_NAME"
            exit 1
          fi
          SIZE=$(du -h "dist/$TARGET_NAME" | cut -f1)
          echo "打包成功：$TARGET_NAME ($SIZE)"
          echo "fpks=$TARGET_NAME" >> $GITHUB_OUTPUT

      # 校验 FPK 基本结构（manifest / cmd / wizard / app 必须存在）。
      # 不强制要求 app/node：默认 FPK 不含 bundled 运行时，安装时由 install_callback
      # 走 npm install 兜底（与历史可用包一致）。
      - name: Verify FPK structure
        run: |
          FPK="dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk"
          echo "校验 $FPK 基本结构 ..."
          for need in '^manifest$' '^cmd/' '^wizard/' '^app/'; do
            if ! tar tzf "$FPK" | grep -qE "$need"; then
              echo "::error:: FPK 缺少必要内容: $need"
              exit 1
            fi
          done
          echo "✅ 基本结构完整 (manifest / cmd / wizard / app)"
          if tar tzf "$FPK" | grep -q '^app/node/lib/node_modules/hermes-web-ui/'; then
            echo "ℹ️ 检测到 bundled 运行时 app/node（离线安装）"
          else
            echo "ℹ️ 未包含 app/node，安装时将走 npm install 兜底（需联网）"
          fi

      # 额外生成一个固定文件名，便于「总是下载最新版」。
      - name: Copy to rolling asset name
        run: |
          cp "dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk" \
             "dist/fnos-${{ env.APP_NAME }}.fpk"
          echo "已生成 dist/fnos-${{ env.APP_NAME }}.fpk"

      # 发布到滚动预发布版本 latest：每次 push 覆盖更新，固定文件名方便获取最新。
      - name: Publish rolling release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest FPK (auto-build)"
          prerelease: true
          overwrite: true
          files: |
            dist/fnos-${{ env.APP_NAME }}.fpk
            dist/fnos-${{ env.APP_NAME }}_v${{ steps.target_version.outputs.target_version }}.fpk
          body: |
            Hermes Studio for fnOS (npm 原生部署，非 Docker) — 自动构建

            - 包版本（迭代号）：`${{ steps.target_version.outputs.target_version }}`
            - 提交：`${{ github.sha }}`
            - 生成时间：${{ github.event.head_commit.timestamp }}

            > ⚠️ 这是滚动预发布版本，每次 push 到 main 会覆盖 `fnos-hermes-studio.fpk`。
            > 固定版本请下载带版本号的附件 `fnos-hermes-studio_v${{ steps.target_version.outputs.target_version }}.fpk`。

      - name: Build Summary
        run: |
          echo "### ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 版本 | FPK 文件名 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| fnOS Hermes Studio | v${{ steps.target_version.outputs.target_version }} | fnos-hermes-studio_v${{ steps.target_version.outputs.target_version }}.fpk |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "滚动最新版见 Release **latest** 的附件 \`fnos-hermes-studio.fpk\`。" >> $GITHUB_STEP_SUMMARY
