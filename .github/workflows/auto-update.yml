name: Auto-update upstream versions

# 自动跟踪上游版本并触发重建：
#   - hermes-web-ui（npm，0.6.x 线）：取 dist-tags.latest
#   - hermes-agent（GitHub release，日期版如 v2026.7.20）：取最新 release 标签
# 任一与 config/bootstrap/*.env 中记录不一致时，更新 env 文件与 manifest 版本号，
# commit 并 push 到 main —— 这会触发 build.yml 构建并发布新 FPK（自动发版）。
# 版本号规则：web-ui 主版本变化则重置 build 计数为 1，否则 build+1。

on:
  schedule:
    # 每天 UTC 03:17 检查一次上游（避开整点，降低 GitHub 限流概率）
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect latest upstream versions
        id: detect
        run: |
          set -e
          WEBUI_LATEST="$(curl -fsSL --max-time 30 https://registry.npmjs.org/hermes-web-ui \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["dist-tags"]["latest"])')"
          AGENT_LATEST="$(curl -fsSL --max-time 30 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')"
          echo "webui_latest=$WEBUI_LATEST" >> "$GITHUB_OUTPUT"
          echo "agent_latest=$AGENT_LATEST" >> "$GITHUB_OUTPUT"
          echo "上游最新：hermes-web-ui=$WEBUI_LATEST  hermes-agent=$AGENT_LATEST"

      - name: Compare and bump
        id: bump
        run: |
          set -e
          WEBUI_LATEST="${{ steps.detect.outputs.webui_latest }}"
          AGENT_LATEST="${{ steps.detect.outputs.agent_latest }}"

          WEBUI_ENV=config/bootstrap/hermes-studio-version.env
          AGENT_ENV=config/bootstrap/hermes-agent-version.env

          CUR_WEBUI="$(grep '^HERMES_STUDIO_VERSION=' "$WEBUI_ENV" | cut -d= -f2)"
          CUR_AGENT="$(grep '^HERMES_AGENT_VERSION=' "$AGENT_ENV" | cut -d= -f2)"

          CUR_VER="$(grep '^version' manifest | cut -d= -f2 | tr -d ' ')"
          CUR_BASE="${CUR_VER%-*}"
          CUR_BUILD="${CUR_VER##*-}"
          case "$CUR_BUILD" in
            ''|*[!0-9]*) CUR_BUILD=0 ;;
          esac

          echo "当前：webui=$CUR_WEBUI agent=$CUR_AGENT fpk=$CUR_VER"

          CHANGED=0
          if [ "$WEBUI_LATEST" != "$CUR_WEBUI" ]; then
            sed -i "s/^HERMES_STUDIO_VERSION=.*/HERMES_STUDIO_VERSION=$WEBUI_LATEST/" "$WEBUI_ENV"
            CHANGED=1
            echo "web-ui 更新: $CUR_WEBUI -> $WEBUI_LATEST"
          fi
          if [ "$AGENT_LATEST" != "$CUR_AGENT" ]; then
            sed -i "s/^HERMES_AGENT_VERSION=.*/HERMES_AGENT_VERSION=$AGENT_LATEST/" "$AGENT_ENV"
            CHANGED=1
            echo "agent 更新: $CUR_AGENT -> $AGENT_LATEST"
          fi

          if [ "$CHANGED" != "1" ]; then
            echo "上下游版本一致，无需更新"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 版本号规则：web-ui 主版本变化则重置 build 为 1，否则 build+1
          if [ "$WEBUI_LATEST" != "$CUR_BASE" ]; then
            NEW_BASE="$WEBUI_LATEST"
            NEW_BUILD=1
          else
            NEW_BASE="$CUR_BASE"
            NEW_BUILD=$((CUR_BUILD + 1))
          fi
          NEW_VER="${NEW_BASE}-${NEW_BUILD}"
          sed -i "s/^version[[:space:]]*=.*/version               = $NEW_VER/" manifest

          echo "新 FPK 版本: $NEW_VER"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Commit & push (triggers build)
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/bootstrap/hermes-studio-version.env \
                  config/bootstrap/hermes-agent-version.env \
                  manifest
          git commit -m "chore: auto-bump upstream -> web-ui ${{ steps.detect.outputs.webui_latest }} / agent ${{ steps.detect.outputs.agent_latest }} (FPK ${{ steps.bump.outputs.new_version }})"
          git push
